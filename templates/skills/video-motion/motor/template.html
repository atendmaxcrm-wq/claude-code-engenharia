<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  @font-face { font-family: "Inter Tight"; src: url("assets/fonts/InterTight.ttf"); font-weight: 100 900; }
  @font-face { font-family: "JB Mono"; src: url("assets/fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
  :root { --acc: #2a7fff; --ink: #f4f4f3; --mut: #8a8a92; --bg: #09090b; --card: #141417; --line: rgba(255,255,255,.1); --f-tit: "Inter Tight", sans-serif; --f-ui: "JB Mono", monospace; }
  html, body { margin: 0; background: var(--bg); }
  #root { position: relative; width: {{W}}px; height: {{H}}px; overflow: hidden; background: var(--bg); font-family: var(--f-tit); color: var(--ink); }
  .clip { position: absolute; inset: 0; }
  #mundo { position: absolute; inset: 0; transform-origin: 50% 45%; }
  #fundo { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; opacity: .38; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; }
  #g1 { width: 1400px; height: 1400px; left: -300px; top: 1100px; background: radial-gradient(circle, color-mix(in srgb, var(--acc) 60%, transparent) 0%, transparent 60%); opacity: .5; }
  #g2 { width: 900px; height: 900px; left: 520px; top: -260px; background: radial-gradient(circle, color-mix(in srgb, var(--acc) 40%, transparent) 0%, transparent 62%); opacity: .35; }
  #grain { position: absolute; left: -64px; top: -64px; width: calc(100% + 128px); height: calc(100% + 128px); background: url("assets/grain.png"); opacity: .075; mix-blend-mode: overlay; pointer-events: none; }
  .topo { position: absolute; left: 66px; right: 66px; top: 150px; display: flex; justify-content: space-between; font: 500 23px var(--f-ui); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .topo b { color: var(--ink); font-weight: 700; }
  .topo .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--acc); margin-right: 12px; vertical-align: 2px; }
  .h { position: absolute; left: 66px; right: 66px; font-weight: 600; letter-spacing: -.05em; line-height: .95; font-variation-settings: "wght" 600; }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .1em; margin-bottom: -.1em; }
  .w > i { display: inline-block; font-style: normal; }
  .acc { color: var(--acc); }
  .cap { position: absolute; left: 66px; font: 500 24px var(--f-ui); letter-spacing: .09em; color: var(--mut); text-transform: uppercase; white-space: nowrap; }
  .cap::before { content: ""; display: inline-block; width: 34px; height: 2px; background: var(--acc); margin-right: 14px; vertical-align: 7px; }
  /* destaque */
  .par { position: absolute; inset: 0; perspective: 1400px; } .par3d { position: absolute; inset: 0; transform-style: preserve-3d; }
  .gigante { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font-weight: 800; letter-spacing: -.06em; line-height: .85; white-space: nowrap; }
  .gigante .l { display: inline-block; } .gigante .o { color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.55); }
  .figura { position: absolute; left: 50%; bottom: -10px; width: 1000px; margin-left: -500px; filter: contrast(1.06) saturate(1.08); }
  .sombra { position: absolute; left: 50%; bottom: 0; width: 900px; height: 500px; margin-left: -450px; background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.75), transparent 70%); }
  .chips { position: absolute; left: 66px; right: 66px; top: 1370px; }
  .chip { display: inline-block; font: 600 25px var(--f-ui); letter-spacing: .07em; padding: 14px 24px; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.22); background: rgba(10,10,12,.6); margin: 0 10px 12px 0; white-space: nowrap; }
  .chip.on { background: var(--acc); border-color: transparent; color: #fff; }
  .pilula { position: absolute; right: 66px; top: 330px; text-align: right; padding: 22px 30px; border-radius: 26px; background: rgba(20,20,23,.85); border: 1.5px solid var(--line); }
  .pilula .k { font: 500 21px var(--f-ui); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .pilula .v { font-size: 92px; font-weight: 500; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
  .pilula .v small { font-size: .45em; color: var(--mut); margin-left: 6px; }
  /* grafico */
  .gnum { position: absolute; right: 66px; top: 640px; font-size: 120px; font-weight: 500; letter-spacing: -.06em; font-variant-numeric: tabular-nums; text-align: right; line-height: 1; }
  .gano { position: absolute; right: 66px; top: 770px; font: 500 26px var(--f-ui); color: var(--mut); letter-spacing: .1em; }
  .marco { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 6px var(--bg), 0 10px 30px rgba(0,0,0,.6); }
  .marco img { width: 50px; height: 56px; object-fit: contain; }
  /* linha do tempo */
  .linhaT { position: absolute; left: 136px; width: 4px; background: linear-gradient(rgba(255,255,255,.25), var(--acc)); transform-origin: top; }
  .tr { position: absolute; left: 66px; right: 66px; display: grid; grid-template-columns: 140px 1fr auto; align-items: center; gap: 26px; }
  .tr .e { width: 140px; height: 140px; border-radius: 34px; background: #f4f4f3; display: grid; place-items: center; overflow: hidden; }
  .tr .e img { width: 96px; height: 108px; object-fit: contain; } .tr .e span { color: #111; font-weight: 800; font-size: 54px; }
  .tr .ano { font: 600 24px var(--f-ui); color: var(--mut); letter-spacing: .1em; }
  .tr .cl { font-size: 58px; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
  .tr .fee { font: 600 28px var(--f-ui); padding: 12px 20px; border-radius: 999px; border: 1.5px solid var(--line); white-space: nowrap; }
  .tr.fim .e { box-shadow: 0 0 0 6px var(--acc), 0 0 50px var(--acc); } .tr.fim .fee { background: var(--acc); border-color: transparent; color: #fff; }
  /* radar e barras */
  .rv { position: absolute; transform: translate(-50%, -50%); text-align: center; }
  .rv .n { font: 500 22px var(--f-ui); letter-spacing: .08em; color: var(--mut); text-transform: uppercase; }
  .rv .v { font-size: 66px; font-weight: 500; letter-spacing: -.05em; font-variant-numeric: tabular-nums; line-height: 1; }
  .rv.top .v, .rv.top .n { color: var(--acc); }
  .bar { position: absolute; left: 66px; right: 66px; display: grid; grid-template-columns: 300px 1fr 130px; align-items: center; gap: 26px; }
  .bar .n { font-size: 44px; font-weight: 500; letter-spacing: -.03em; }
  .bar .trk { height: 26px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar .fi { height: 100%; width: 100%; border-radius: 999px; background: rgba(255,255,255,.82); transform-origin: left center; }
  .bar.top .fi { background: linear-gradient(90deg, var(--acc), color-mix(in srgb, var(--acc) 60%, white)); box-shadow: 0 0 30px var(--acc); }
  .bar .v { text-align: right; font-size: 64px; font-weight: 500; letter-spacing: -.05em; font-variant-numeric: tabular-nums; } .bar.top .v { color: var(--acc); }
  /* video */
  .card { position: absolute; border-radius: 40px; overflow: hidden; background: var(--card); box-shadow: 0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1.5px rgba(255,255,255,.08); }
  .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .idx { position: absolute; right: 66px; font: 600 26px var(--f-ui); color: var(--mut); letter-spacing: .1em; }
  .tagcard { position: absolute; left: 30px; bottom: 30px; font: 600 22px var(--f-ui); letter-spacing: .08em; padding: 10px 18px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; }
  .spot { position: absolute; inset: 0; pointer-events: none; }
  .anel { position: absolute; border-radius: 50%; border: 5px solid var(--acc); box-shadow: 0 0 40px var(--acc), inset 0 0 30px color-mix(in srgb, var(--acc) 50%, transparent); }
  .anelTag { position: absolute; font: 700 24px var(--f-ui); letter-spacing: .08em; padding: 10px 18px; border-radius: 999px; background: var(--acc); color: #fff; white-space: nowrap; }
  .lento { position: absolute; right: 30px; top: 30px; font: 700 22px var(--f-ui); letter-spacing: .08em; padding: 10px 18px; border-radius: 999px; background: #fff; color: #000; }
  .golbox { position: absolute; left: 0; top: 520px; width: 100%; height: 1000px; background: #000; mix-blend-mode: screen; }
  .golbox video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.2) contrast(1.1); }
  .golt { position: absolute; inset: 0; background: #000; color: #fff; mix-blend-mode: multiply; display: flex; align-items: center; justify-content: center; font-weight: 900; letter-spacing: -.06em; line-height: 1; white-space: nowrap; }
  /* numeros */
  .box { position: absolute; width: 456px; height: 360px; border-radius: 36px; background: var(--card); border: 1.5px solid var(--line); padding: 36px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .box .v { font-size: 150px; font-weight: 500; letter-spacing: -.06em; line-height: .9; font-variant-numeric: tabular-nums; }
  .box .k { font: 500 24px var(--f-ui); letter-spacing: .1em; color: var(--mut); text-transform: uppercase; }
  .box.top { background: var(--acc); border-color: transparent; } .box.top .k { color: rgba(255,255,255,.85); }
  /* mockup */
  .celular { position: absolute; left: 50%; top: 520px; width: 600px; height: 1220px; margin-left: -300px; border-radius: 86px; background: #000; box-shadow: 0 0 0 14px #1d1d21, 0 0 0 16px rgba(255,255,255,.12), 0 60px 120px -40px rgba(0,0,0,.95); overflow: hidden; }
  .celular::after { content: ""; position: absolute; left: 50%; top: 22px; width: 170px; height: 46px; margin-left: -85px; border-radius: 999px; background: #000; }
  .notebook { position: absolute; left: 50%; top: 640px; width: 980px; height: 620px; margin-left: -490px; border-radius: 26px 26px 6px 6px; background: #000; box-shadow: 0 0 0 12px #1d1d21, 0 60px 120px -40px rgba(0,0,0,.95); overflow: hidden; }
  .notebook::after { content: ""; position: absolute; left: -70px; right: -70px; bottom: -42px; height: 30px; border-radius: 0 0 30px 30px; background: #2a2a2f; }
  .tela { position: absolute; left: 0; top: 0; width: 100%; }
  .marca { position: absolute; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 64px; letter-spacing: .2em; white-space: nowrap; }
  #wipe, #wipe2 { position: absolute; top: -200px; left: 0; width: 1700px; height: 2400px; transform: translateX(-1900px) skewX(-14deg); }
  #wipe { background: var(--acc); } #wipe2 { background: #f4f4f3; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  /* ui_produto: um conteiner que muda de forma (svg rect) + conteudo recortado por ele + cursor */
  .uiSvg { position: absolute; left: 0; top: 0; overflow: visible; }
  .uiCt { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center; text-align: center; box-sizing: border-box; }
  .uiCt .btn { font: 600 var(--fs, 44px) var(--f-tit); letter-spacing: -.02em; white-space: nowrap; }
  .uiCt .campo { width: 100%; padding: 0 42px; box-sizing: border-box; text-align: left; }
  .uiCt .campo .k { font: 500 30px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; opacity: .55; margin-bottom: 8px; }
  .uiCt .campo .v { font: 500 var(--fs, 54px) var(--f-tit); letter-spacing: -.02em; white-space: nowrap; }
  .uiCt .campo .v::after { content: ""; display: inline-block; width: 3px; height: 1em; background: currentColor; margin-left: 4px; vertical-align: -.12em; }
  .uiCt .lista { width: 100%; padding: 0 48px; box-sizing: border-box; text-align: left; }
  .uiCt .lista div { font: 500 var(--fs, 42px) var(--f-tit); letter-spacing: -.02em; padding: 18px 0; border-bottom: 1.5px solid currentColor; border-color: color-mix(in srgb, currentColor 14%, transparent); white-space: nowrap; }
  .uiCt .lista div::before { content: ""; display: inline-block; width: 22px; height: 22px; border-radius: 7px; background: var(--acc); margin-right: 22px; vertical-align: 1px; }
  .uiCt .card2 { width: 100%; padding: 0 52px; box-sizing: border-box; text-align: left; }
  .uiCt .card2 .t { font: 650 var(--fs, 64px) var(--f-tit); letter-spacing: -.04em; line-height: 1; }
  .uiCt .card2 .x { font: 500 40px var(--f-tit); opacity: .62; margin-top: 18px; line-height: 1.25; }
  .uiCt .img { position: absolute; inset: 0; background-repeat: no-repeat; }
  .uiNota { position: absolute; left: 0; right: 0; text-align: center; font: 500 34px var(--f-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--mut); }
  .uiCt .enviar { position: absolute; right: 22px; top: 50%; width: 84px; height: 84px; margin-top: -42px; border-radius: 50%; background: var(--acc); display: grid; place-items: center; }
  .cursor { position: absolute; left: 0; top: 0; width: 52px; height: 52px; transform-origin: 6px 4px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.45)); }
  .onda { position: absolute; left: 0; top: 0; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid var(--acc); }
/*ESTILO*/
</style></head>
<body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-fps="{{FPS}}" data-start="0" data-duration="{{TOTAL}}">
  <audio id="trilha" data-timeline-role="music" data-start="0" data-duration="{{TOTAL}}" src="assets/trilha.wav"></audio>
  <svg width="0" height="0" style="position:absolute"><filter id="mb" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="mbBlur" stdDeviation="0 0"/></filter></svg>
  <div id="mundo">
    <!--FUNDO-->
    <div class="glow" id="g1"></div><div class="glow" id="g2"></div>
<!--CENAS-->
<!--MIDIA-->
  </div>
  <div class="topo"><span><span class="dot"></span><b id="marcaTopo"></b></span><span id="topoDir"></span></div>
  <div id="grain"></div><div id="wipe"></div><div id="wipe2"></div><div id="flash"></div>

  <script src="gsap.min.js"></script>
  <script>
    // Renderizador generico do /video-motion. Todos os tempos vem calculados do montar.py (mesmos do som).
    const D = /*DADOS*/{};
    const B = D.B, TECLA = D.tecla, $ = (id) => document.getElementById(id);
    document.documentElement.style.setProperty("--acc", D.cor);
    const W = D.W || 1080, H = D.H || 1920, VERT = H > W, MX = VERT ? 66 : Math.round(W * .06);   // margem lateral
    const LW = Math.round(Math.max(W, H) * .9);        // lamina de transicao: larga o bastante pra cobrir o quadro inclinada e sair inteira
    ["wipe", "wipe2"].forEach((id) => Object.assign($(id).style, { width: LW + "px", height: H + 480 + "px", top: "-240px" }));
    gsap.set(["#wipe", "#wipe2"], { x: -LW - 300, skewX: -14 });
    if (!VERT) { const tp = document.querySelector(".topo"); tp.style.top = "56px"; tp.style.left = tp.style.right = MX + "px"; }
    $("marcaTopo").textContent = D.marca || "";
    const tl = gsap.timeline({ paused: true });

    // ---------- utilitarios
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    function frase(el, txt) {         // *palavra* = cor de destaque; " / " = quebra de linha
      el.innerHTML = txt.split(" ").map((p) => (p === "/" ? "<br>" : `<span class="w"><i class="${p.startsWith("*") ? "acc" : ""}">${esc(p.replace(/\*/g, ""))}</i></span>`)).join(" ");
      return el.querySelectorAll(".w > i");
    }
    const entra = (els, t0, passo) => els.forEach((w, i) => tl.from(w, { yPercent: 115, duration: .55, ease: "power4.out" }, t0 + i * passo));
    function digita(el, txt, t0) {
      const o = { n: 0 }; el.textContent = "";
      tl.to(o, { n: txt.length, duration: txt.length * TECLA, ease: "none", onUpdate: () => (el.textContent = txt.slice(0, Math.floor(o.n + 1e-6))) }, t0);
    }
    const borrao = (t0) => tl.fromTo("#mbBlur", { attr: { stdDeviation: "26 0" } }, { attr: { stdDeviation: "0 0" }, duration: .28, ease: "power2.out", immediateRender: false }, t0);
    function tremida(t0, f) { [12, -10, 8, -6, 4, -2, 0].forEach((v, i) => tl.to("#mundo", { x: v * (f || 1), y: -v * .6 * (f || 1), duration: .035, ease: "none" }, t0 + i * .035)); }
    function pesoPulsa(el, t0, n) { for (let i = 0; i < n; i++) tl.fromTo(el, { fontVariationSettings: '"wght" 800' }, { fontVariationSettings: '"wght" 600', duration: B * 1.6, ease: "power2.out", immediateRender: false }, t0 + i * B * 2); }
    // mola em forma fechada (sem estado entre quadros): amortecimento 0.78 = sobra de ~2%, assenta no fim da duracao
    const mola = (z = .78) => { const wd = Math.sqrt(1 - z * z); return (p) => (p >= 1 ? 1 : 1 - Math.exp(-z * p * 6.5) * (Math.cos(wd * p * 6.5) + (z / wd) * Math.sin(wd * p * 6.5))); };
    const rotulo = (t, txt) => tl.set("#topoDir", { textContent: txt || "" }, t);
    const janela = (el, a, b) => tl.set(el, { autoAlpha: 0 }, 0).set(el, { autoAlpha: 1 }, a).set(el, { autoAlpha: 0 }, b);
    const num = (s) => parseFloat(String(s).replace(",", "."));
    const fmtValor = (v, f) => {
      if (f === "euro_mi" || f === "real_mi" || f === "dolar_mi") { const s = { euro_mi: "€", real_mi: "R$", dolar_mi: "US$" }[f]; return v < 1 ? `${s} ${Math.round(v * 1000)} mil` : `${s} ${v % 1 ? v.toFixed(1).replace(".", ",") : v} mi`; }
      if (f === "porcento") return `${Math.round(v)}%`;
      return v % 1 ? v.toFixed(1).replace(".", ",") : String(Math.round(v));
    };
    function el(html, pai) { const d = document.createElement("div"); d.innerHTML = html; const n = d.firstElementChild; pai.appendChild(n); return n; }
    function titulo(c, i, top, size) { if (!c.titulo) return; const h = el(`<div class="h" style="top:${top || 290}px;font-size:${size || 140}px"></div>`, $("c" + i)); entra(frase(h, c.titulo), c.t + .15, B); return h; }
    function legenda(c, i, top) { if (!c.legenda) return; const l = el(`<div class="cap" style="top:${top}px">${esc(c.legenda)}</div>`, $("c" + i)); tl.from(l, { opacity: 0, x: -40, duration: .5 }, c.t + B * 2); return l; }

    // ---------- vida continua
    tl.fromTo("#mundo", { scale: 1 }, { scale: 1.06, duration: D.total, ease: "none" }, 0);
    tl.fromTo("#g1", { x: -100, y: 80 }, { x: 260, y: -420, duration: D.total, ease: "sine.inOut" }, 0);
    tl.fromTo("#g2", { x: 60 }, { x: -320, y: 300, duration: D.total, ease: "sine.inOut" }, 0);
    tl.to("#grain", { x: 47, y: -31, duration: 1 / 15, ease: "steps(1)", repeat: Math.ceil(D.total * 15), yoyo: true }, 0);
    tl.from(".topo", { opacity: 0, y: -20, duration: .6, ease: "power3.out" }, .1);

    // ---------- cenas
    const R = {};
    R.titulo = (c, i) => {
      const ty = Math.round(H * (VERT ? .495 : .36));
      if (c.legenda) { const l = el(`<div class="cap" style="top:${ty - 70}px;left:${MX}px">${esc(c.legenda)}</div>`, $("c" + i)); tl.from(l, { opacity: 0, x: -40, duration: .5, ease: "power3.out" }, c.t + .15); }
      const h = el(`<div class="h" style="top:${ty}px;left:${MX}px;right:${MX}px;font-size:${c.tamanho || 196}px"></div>`, $("c" + i));
      h.innerHTML = c.linhas.map((ln) => `<div><span class="w"><i class="${ln.startsWith("*") ? "acc" : ""}" style="filter:url(#mb)">${esc(ln.replace(/\*/g, ""))}</i></span></div>`).join("");
      const ws = h.querySelectorAll("i");
      ws.forEach((w, k) => {
        const tk = c.tLinhas[k];
        if (k < ws.length - 1) { tl.from(w, { x: 260, opacity: 0, duration: .5, ease: "power4.out" }, tk); borrao(tk); }
        else { tl.from(w, { yPercent: 115, duration: .6, ease: "power4.out" }, tk); tremida(tk, .8); }
      });
      tl.fromTo(h, { scale: 1 }, { scale: 1.08, duration: c.dur - (c.tLinhas[c.tLinhas.length - 1] - c.t), ease: "none" }, c.tLinhas[c.tLinhas.length - 1]);
    };
    R.destaque = (c, i) => {
      const box = $("c" + i), fim = c.t + c.dur, palavra = (c.palavra || "").toUpperCase();
      const letras = () => palavra.split("").map((l) => `<span class="l">${esc(l)}</span>`).join("");
      const par = el(`<div class="par"><div class="par3d"><div class="gigante" style="font-size:${c.tamanho_palavra || Math.min(260, Math.floor(1700 / Math.max(4, palavra.length)))}px"><div style="filter:url(#mb)">${letras()}</div><div class="o">${letras()}</div></div><div class="sombra"></div>${c.imagem ? `<img class="figura" src="${esc(c.imagem)}" alt="">` : ""}</div></div>`, box);
      const g = par.querySelector(".gigante"), fig = par.querySelector(".figura");
      tl.from(g.querySelectorAll("div:first-child .l"), { yPercent: 120, opacity: 0, duration: .5, stagger: .035, ease: "power4.out" }, c.t + .25);
      tl.from(g.querySelectorAll(".o .l"), { yPercent: -120, opacity: 0, duration: .5, stagger: .035, ease: "power4.out" }, c.t + .4);
      tl.fromTo(par.querySelector(".par3d"), { rotationY: 7, rotationX: -2 }, { rotationY: -7, rotationX: 2, duration: c.dur, ease: "sine.inOut" }, c.t);
      tl.fromTo(g, { x: 60, z: -220 }, { x: -110, z: -220, duration: c.dur, ease: "none" }, c.t);
