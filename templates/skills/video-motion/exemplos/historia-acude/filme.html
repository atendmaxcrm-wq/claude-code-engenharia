<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(assets/Montserrat.ttf);font-weight:100 900}

</style></head><body><div id="palco"><canvas id="c" width="1080" height="1920"></canvas></div>
<script src="assets/palavras.js"></script>
<script>
// "Você construiu um açude no sertão" - render(t) puro, voz manda no tempo (vídeo = voz + 0,4 s)
const OFF = 0.4, cv = document.getElementById('c'), X = cv.getContext('2d');
const P = window.PAL;
function W(w, n = 1) { let k = 0; for (const p of P) { if (p[0] === w) { k++; if (k === n) return p[1] + OFF; } } throw new Error('sem ' + w + n); }
const END = P[P.length - 1][2] + OFF, TOTAL = END + 3.2;
window.TOTAL = TOTAL;
const L = [W('Se'), W('Porque'), W('Então', 1), W('Mas', 1), W('Então', 2), W('Mas', 2), W('Então', 3), W('Mas', 3), W('Então', 4), W('Mas', 4), W('Então', 5), W('Mas', 5), W('Então', 6), W('Parece'), W('Parabéns')];
const T = {
  buraco: W('buraco'), chuva: W('chuva'), meses: W('meses'), areia: W('areia'), muro: W('muro'), enx: W('enxurrada', 1), barr: W('barragem', 1),
  poros: W('poros'), vazar: W('vazar'), argila: W('argila'), nucleo: W('núcleo'), inverno: W('inverno'), sobe: W('sobe'), leva: W('leva'),
  canal: W('canal'), sang: W('sangradouro'), sol: W('sol', 1), dois: W('dois'), fundo: W('fundo', 1), estreito: W('estreito'),
  enx2: W('enxurrada', 2), lama: W('lama'), arv: W('árvores'), raiz: W('raízes'), ciliar: W('ciliar'), parada: W('parada'), abaixo: W('abaixo'),
  valv: W('válvula'), solta: W('solta'), correr: W('correr'), ceara: W('Ceará'), cidade: W('cidade'), lugar: W('lugar'), jag: W('Jaguaribara'),
  cast: W('Castanhão'), parab: W('Parabéns'), constr: W('construiu')
};
window.TEMPOS = { L, T, END, TOTAL };

// ---------- utilidades ----------
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const pr = (t, a, d) => cl((t - a) / d);
const io = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const eo = p => 1 - Math.pow(1 - p, 3);
const mola = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-7 * p) * Math.cos(9 * p);
const h = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function keys(K, t) { // [[t,v],...] com io entre chaves
  if (t <= K[0][0]) return K[0][1];
  for (let i = 1; i < K.length; i++) if (t < K[i][0]) { const a = K[i - 1], b = K[i]; return lerp(a[1], b[1], io((t - a[0]) / (b[0] - a[0]))); }
  return K[K.length - 1][1];
}
const C = {
  ceu1: '#7cc6ef', ceu2: '#d9f1fb', solo: '#c98a4b', solo2: '#b77840', solo3: '#9e6337', solo4: '#84512e', rocha: '#77706a',
  areia: '#e3c27e', seca: '#d8b06a', agua: '#3d9be0', agua2: '#2a7fc4', aguaTopo: '#9fdcff', terra: '#d39a5c', terraLinha: '#6b4426',
  argila: '#8e3f2a', argila2: '#a8523a', pedra: '#9aa1a8', pedra2: '#6f767d', verde: '#5f9e3a', verde2: '#3f7f2c', serra: '#dcc896',
  tinta: '#1d1d1f', amarelo: '#ffd23f', verm: '#e5383b', lama: '#8a5a2e'
};

// ---------- geometria do mundo (x 0..3000, y pra baixo; leito em 1160) ----------
const LEITO = 1160, CRISTA = 880, SANG = 905;
function cava(t) { return eo(pr(t, T.buraco - 0.5, 1.0)) * (1 - pr(t, L[2] + .2, .6)); }
function superficie(t) {
  const pit = LEITO + 70 * cava(t);
  return [[-4000, 700], [0, 700], [250, 715], [450, 880], [650, LEITO], [975, LEITO], [1000, pit], [1060, pit], [1085, LEITO],
  [1960, LEITO], [1975, 1186], [2950, 1186], [2965, LEITO], [7000, LEITO]];
}
function ySup(S, x) { for (let i = 1; i < S.length; i++) if (x <= S[i][0]) { const a = S[i - 1], b = S[i]; return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0])); } return LEITO; }
function erosao(t) { return eo(pr(t, T.leva - 0.2, 1.1)) * (1 - io(pr(t, L[6], 0.9))); }
function barragem(t) {
  const hh = damH(t), cy = LEITO - 280 * hh, e = erosao(t);
  return [[1450, LEITO], [1600, cy], [1640 - 15 * e, cy + 8 * e], [1700, cy + 175 * e], [1850, LEITO]];
}
function topoBarr(t, x) { const B = barragem(t); if (x < 1450 || x > 1850 || damH(t) <= 0) return null; return ySup(B, x); }
function nivel(t) {
  return keys([[0, 1400], [T.enx - .2, 1400], [T.enx, 1175], [T.barr + .6, 930], [T.vazar, 930], [T.argila, 985], [T.nucleo, 985], [T.nucleo + 1.2, 930],
  [T.sobe - .4, 930], [T.leva, 866], [L[6] + .2, 866], [T.sang - .2, 903], [T.sol, 903], [T.dois + 1.2, 965], [T.valv, 965], [T.correr, 975], [999, 975]], t);
}
function rioCheia(t) { return eo(pr(t, T.chuva + .2, .9)) * (1 - io(pr(t, T.areia - .7, 1.0))); }

// ---------- câmera ----------
const MOV = [];
let CAM0 = [1040, 1130, 2.1];
function defineCam() {
  const m = (a, b, x, y, s) => MOV.push([a, b, x, y, s]);
  m(0, L[1] - .1, 1035, 1150, 2.5);
  m(L[1], L[1] + .7, 1060, 980, .95);
  m(L[2], L[2] + .8, 1500, 1000, 1.0);
  m(L[3], L[3] + .7, 1640, 1160, 1.7);
  m(L[4], L[4] + .6, 1650, 1060, 1.2);
  m(L[5], L[5] + .6, 1620, 960, 1.1);
  m(L[6], L[6] + .6, 1720, 1010, 1.2);
  m(L[7], L[7] + .8, 1080, 860, .85);
  m(L[8], L[9], 1060, 830, .9);
  m(L[9], L[9] + .7, 640, 990, 1.0);
  m(L[10], L[10] + .7, 330, 900, 1.2);
  m(T.raiz - .3, T.raiz + .5, 340, 1040, 1.2);
  m(L[11], L[11] + .8, 2450, 1040, 1.2);
  m(L[12], L[12] + .6, 1980, 1080, 1.25);
  m(T.correr - 1.4, T.correr + .4, 2330, 1060, .85);
  m(T.parab - .3, T.parab + .5, 1520, 900, .74);
  m(T.parab + .5, TOTAL, 1520, 890, .8);
}
defineCam();
function cam(t) {
  let [x, y, s] = CAM0;
  for (const [a, b, cx, cy, cs] of MOV) {
    if (t <= a) break;
    const p = io(pr(t, a, b - a)); x = lerp(x, cx, p); y = lerp(y, cy, p); s = Math.exp(lerp(Math.log(s), Math.log(cs), p));
  }
  s *= 1 + .008 * Math.sin(t * .9); x += Math.sin(t * .37) * 5 / s; y += Math.sin(t * .29) * 4 / s;
  // tremor no "leva tudo"
  const tr = pr(t, T.leva - .2, .2) * (1 - pr(t, T.leva + .5, .6));
  x += Math.sin(t * 61) * 6 * tr / s; y += Math.cos(t * 47) * 6 * tr / s;
  return { x, y, s };
}
let K = null;
const tela = (wx, wy) => [(wx - K.x) * K.s + 540, (wy - K.y) * K.s + 900];

// ---------- desenho do mundo ----------
function poli(pts, fill, stroke, lw) { X.beginPath(); pts.forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.closePath(); if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.strokeStyle = stroke; X.lineWidth = lw; X.lineJoin = 'round'; X.stroke(); } }
function linha(pts, cor, lw) { X.beginPath(); pts.forEach((p, i) => i ? X.lineTo(p[0], p[1]) : X.moveTo(p[0], p[1])); X.strokeStyle = cor; X.lineWidth = lw; X.lineCap = 'round'; X.lineJoin = 'round'; X.stroke(); }

function chuvaForca(t) {
  const a = pr(t, T.chuva - .1, .4) * (1 - pr(t, T.areia - .9, .6));
  const b = pr(t, T.enx - .6, .4) * (1 - pr(t, T.barr + .2, .6));
  const c = pr(t, T.inverno - .2, .4) * (1 - pr(t, T.leva + .4, .6));
  const d = pr(t, T.enx2 - .4, .4) * (1 - pr(t, T.lama + .2, .6));
  return Math.max(a, b, c * 1.2, d * .8);
}
function nuvens(t) {
  const ch = cl(chuvaForca(t)); if (ch <= 0) return;
  for (let i = 0; i < 7; i++) {
    const wx = -200 + i * 300 + Math.sin(t * .3 + i) * 30, wy = 380 + h(i) * 120;
    X.save(); X.globalAlpha = ch; X.fillStyle = '#7d8794';
    const [sx, sy] = tela(wx, wy - 80 * (1 - ch)); const r = 70 * K.s;
    X.beginPath(); X.arc(sx, sy, r, 0, 7); X.arc(sx + r * 1.1, sy - r * .4, r * 1.15, 0, 7); X.arc(sx + r * 2.2, sy, r * .9, 0, 7); X.fill(); X.restore();
  }
}
function chuva(t) {
  const ch = chuvaForca(t); if (ch <= 0) return;
  X.save(); X.globalAlpha = cl(.55 * ch); X.strokeStyle = '#e8f4ff'; X.lineWidth = 3; X.lineCap = 'round';
  const n = 160;
  for (let i = 0; i < n; i++) {
    const sx = h(i) * 1240 - 80, ciclo = 1.0 + h(i + 9) * .4;
    const sy = ((h(i + 50) + t / ciclo * 1.6) % 1) * 2100 - 100;
    X.beginPath(); X.moveTo(sx, sy); X.lineTo(sx - 14, sy + 46); X.stroke();
  }
  X.restore();
}
function serra(t) {
  // serra ao fundo (caatinga) + mandacarus
  const pts = [[-4000, 1000], [-300, 980], [100, 930], [400, 990], [800, 960], [1200, 1010], [1600, 990], [1900, 1110], [2100, 1080], [2350, 1062], [2750, 1056], [3100, 1075], [3500, 1050], [7000, 1040], [7000, 1300], [-4000, 1300]];
  poli(pts.map(p => tela(p[0], p[1])), C.serra);
  [[-120, 700, 1], [160, 712, .8], [820, 962, .6], [3150, 1072, .7]].forEach(([x, y, s]) => mandacaru(x, y, s));
}
function mandacaru(wx, wy, s) {
  const [x, y] = tela(wx, wy); const k = K.s * s;
  X.save(); X.translate(x, y); X.scale(k, k); X.fillStyle = '#6f9a3e'; X.strokeStyle = '#46682a'; X.lineWidth = 4;
  const rr = (a, b, w, hh) => { X.beginPath(); X.roundRect(a, b, w, hh, w / 2); X.fill(); X.stroke(); };
  rr(-14, -150, 28, 150); rr(-52, -105, 22, 60); rr(-52, -62, 40, 20); rr(30, -125, 22, 70); rr(12, -72, 40, 20);
  X.restore();
}
function solo(t, S) {
  const pts = S.concat([[7000, 4000], [-4000, 4000]]).map(p => tela(p[0], p[1]));
  X.save(); poli(pts, C.solo); X.clip();
  // camadas onduladas
  const cam = [[1235, C.solo2], [1360, C.solo3], [1510, C.solo4], [1720, '#6f4328'], [1980, '#5b3822']];
  for (const [yy, cor] of cam) {
    X.beginPath(); const [x0] = tela(-4000, 0); X.moveTo(-10, tela(0, yy)[1]);
    for (let sx = -10; sx <= 1100; sx += 30) { const wx = K.x + (sx - 540) / K.s; X.lineTo(sx, tela(wx, yy + Math.sin(wx / 180) * 14 + Math.sin(wx / 67) * 5)[1]); }
    X.lineTo(1100, 1930); X.lineTo(-10, 1930); X.closePath(); X.fillStyle = cor; X.fill();
  }
  // pedrinhas no solo
  for (let i = 0; i < 70; i++) {
    const wx = h(i + 300) * 3600 - 300, wy = 1250 + h(i + 400) * 450;
    const [sx, sy] = tela(wx, wy); if (sx < -30 || sx > 1110 || sy < -30 || sy > 1950) continue;
    X.fillStyle = 'rgba(60,35,20,.28)'; X.beginPath(); X.ellipse(sx, sy, (8 + h(i) * 10) * K.s, (5 + h(i) * 6) * K.s, 0, 0, 7); X.fill();
  }
  X.restore();
  // faixa da superfície: capim seco no morro, areia no leito
  X.save(); X.lineJoin = 'round';
  linha(S.filter(p => p[0] <= 650).map(p => tela(p[0], p[1])), '#a58e45', 12 * K.s);
  linha(S.filter(p => p[0] >= 650).map(p => tela(p[0], p[1])), C.areia, 10 * K.s);
  X.restore();
}
function rachaduras(t, x0, x1, y, alpha) {
  if (alpha <= 0) return;
  X.save(); X.globalAlpha = alpha; X.strokeStyle = 'rgba(90,55,25,.8)'; X.lineWidth = 3 * K.s;
  for (let wx = x0; wx < x1; wx += 55) {
    const i = wx / 55; let px = wx, py = y + 2; X.beginPath(); X.moveTo(...tela(px, py));
    for (let k = 0; k < 3; k++) { px += (h(i + k) - .5) * 30; py += 9 + h(i * 3 + k) * 8; X.lineTo(...tela(px, py)); }
    X.stroke();
  }
  X.restore();
}
function rioJusante(t) {
  // água no rio abaixo da barragem: sangradouro (temporária) e válvula (fica)
  const sp = eo(pr(t, T.sang - .1, 1.1)) * (1 - io(pr(t, T.sol + .6, 1.4)));
  const vf = eo(pr(t, T.solta + .5, 2.4));
  const front = Math.max(sp > 0 ? 1 : 0, vf), lv = Math.max(sp, vf ? 1 : 0) * Math.max(sp, vf > 0 ? 1 : 0);
  const lvl = Math.max(sp, vf > 0 ? 1 : 0);
  if (lvl <= 0) return;
  const x1 = sp > 0 ? 2950 : lerp(1860, 2950, vf);
  const top = 1186 - 20 * lvl;
  poli([tela(1850, top), tela(x1, top), tela(x1, 1188), tela(1850, 1188)], C.agua);
  // brilhos andando
  X.save(); X.strokeStyle = 'rgba(255,255,255,.7)'; X.lineWidth = 4 * K.s; X.lineCap = 'round';
  for (let i = 0; i < 14; i++) { const wx = 1870 + ((i * 80 + t * 160) % 1100); if (wx > x1 - 20) continue; X.beginPath(); X.moveTo(...tela(wx, top + 7)); X.lineTo(...tela(wx + 30, top + 7)); X.stroke(); }
  X.restore();
}
function lama(t) {
  const sd = 75 * eo(pr(t, T.enx2 + .2, 3.2));
  if (sd <= 0) return;
  const pts = [];
  for (let wx = 650; wx <= 1460; wx += 20) pts.push(tela(wx, LEITO - sd * (1 - Math.pow(Math.abs(wx - 1050) / 420, 3)) + Math.sin(wx / 33) * 3));
  pts.push(tela(1460, LEITO + 4), tela(650, LEITO + 4)); poli(pts, C.lama);
  // fios de lama descendo o morro
  const a = pr(t, T.enx2 - .3, .5) * (1 - pr(t, T.raiz, 1.0));
  if (a > 0) {
    X.save(); X.globalAlpha = a; X.strokeStyle = '#7a4c22'; X.lineWidth = 9 * K.s; X.lineCap = 'round'; X.setLineDash([26 * K.s, 18 * K.s]); X.lineDashOffset = -t * 220 * K.s;
    for (let k = 0; k < 4; k++) { const S = superficie(t); const xs = []; for (let wx = 100 + k * 60; wx <= 660; wx += 30) xs.push(tela(wx, ySup(S, wx) - 6 - k * 3)); linha(xs, '#7a4c22', 9 * K.s); }
    X.restore();
  }
}
function infiltracao(t) {
  const a = pr(t, T.poros - .2, .4) * (1 - pr(t, T.nucleo + 1.0, .6)); if (a <= 0) return;
  const path = [[1330, 1120], [1470, 1190], [1650, 1232], [1830, 1205], [1960, 1172]];
  const comNucleo = t > T.argila + .9;
  const at = f => { const n = path.length - 1, k = Math.min(n - 1, Math.floor(f * n)), u = f * n - k; return [lerp(path[k][0], path[k + 1][0], u), lerp(path[k][1], path[k + 1][1], u)]; };
  X.save(); X.globalAlpha = a;
  for (let i = 0; i < 16; i++) {
    let f = (i / 16 + t * .22) % 1; let [wx, wy] = at(f);
    if (comNucleo && wx > 1612) { wx = 1612 - h(i) * 30; wy = lerp(1180, 1260, h(i + 5)); }
    const [sx, sy] = tela(wx, wy + Math.sin(i + t * 4) * 6); const r = 11 * K.s;
    X.fillStyle = '#5ab8ff'; X.beginPath(); X.moveTo(sx, sy - r * 1.7); X.quadraticCurveTo(sx + r, sy - r * .2, sx, sy + r); X.quadraticCurveTo(sx - r, sy - r * .2, sx, sy - r * 1.7); X.fill();
  }
  X.restore();
  // poça vazando a jusante
  const pz = pr(t, T.vazar, .8) * (1 - pr(t, T.nucleo, 1)); if (pz > 0) { X.save(); X.globalAlpha = pz; X.fillStyle = C.agua; const [sx, sy] = tela(1990, LEITO - 2); X.beginPath(); X.ellipse(sx, sy, 70 * K.s, 10 * K.s, 0, 0, 7); X.fill(); X.restore(); }
}
function evaporacao(t) {
  const a = pr(t, T.sol - .2, .5) * (1 - pr(t, L[9] - .2, .6)); if (a <= 0) return;
  const wl = nivel(t);
  X.save(); X.globalAlpha = a * .8; X.strokeStyle = '#ffffff'; X.lineWidth = 6 * K.s; X.lineCap = 'round';
  for (let i = 0; i < 14; i++) {
    const wx = 520 + i * 70, f = (t * .5 + h(i)) % 1; const base = wl - 10 - f * 260;
    X.globalAlpha = a * .8 * Math.sin(f * Math.PI);
    X.beginPath(); for (let k = 0; k <= 8; k++) { const yy = base - k * 12; const xx = wx + Math.sin(k * .9 + t * 4 + i) * 10; const [sx, sy] = tela(xx, yy); k ? X.lineTo(sx, sy) : X.moveTo(sx, sy); } X.stroke();
  }
  X.restore();
  // régua na face da barragem
  const p = pr(t, T.dois - .6, 1.6);
  if (p > 0) {
    const [x0, y0] = tela(1400, 903), [x1, y1] = tela(1400, nivel(t));
    X.save(); X.strokeStyle = C.verm; X.lineWidth = 6; X.beginPath(); X.moveTo(x0 - 30, y0); X.lineTo(x0 + 30, y0); X.stroke();
    X.setLineDash([10, 8]); X.beginPath(); X.moveTo(x0, y0); X.lineTo(x1, y1); X.stroke(); X.setLineDash([]);
    X.fillStyle = C.verm; X.beginPath(); X.moveTo(x1, y1 + 4); X.lineTo(x1 - 14, y1 - 18); X.lineTo(x1 + 14, y1 - 18); X.fill();
    X.restore();
  }
}
function sol(t) {
  const a = pr(t, T.sol - .5, .6) * (1 - pr(t, L[9] - .3, .6)); if (a <= 0) return;
  X.save(); X.globalAlpha = a; X.translate(840, 330 - 60 * (1 - eo(a)));
  X.rotate(t * .4); X.fillStyle = '#ffb21e';
  for (let i = 0; i < 12; i++) { X.rotate(Math.PI / 6); X.beginPath(); X.moveTo(-14, -150); X.lineTo(14, -150); X.lineTo(0, -205 - Math.sin(t * 6 + i) * 10); X.fill(); }
  X.beginPath(); X.arc(0, 0, 120, 0, 7); X.fillStyle = '#ffc93c'; X.fill(); X.lineWidth = 10; X.strokeStyle = '#ff9f1c'; X.stroke();
  X.restore();
}
function cano(t) {
  const r = eo(pr(t, T.valv - .3, .8)); if (r <= 0) return;
  const x1 = lerp(1440, 1880, r);
  X.save();
  poli([tela(1440, 1112), tela(x1, 1112), tela(x1, 1136), tela(1440, 1136)], '#8d959c', '#4c545b', 4 * K.s);
  const fl = pr(t, T.solta, .6);
  if (fl > 0) { X.setLineDash([16 * K.s, 14 * K.s]); X.lineDashOffset = -t * 260 * K.s; linha([tela(1450, 1124), tela(x1, 1124)], `rgba(90,184,255,${fl})`, 10 * K.s); X.setLineDash([]); }
  // volante da válvula
  if (r >= 1) {
    const [sx, sy] = tela(1880, 1096); const ang = 5 * io(pr(t, T.solta - .4, 1.4)); const R = 30 * K.s;
    X.translate(sx, sy); X.rotate(ang); X.strokeStyle = C.verm; X.lineWidth = 7 * K.s; X.beginPath(); X.arc(0, 0, R, 0, 7); X.stroke();
    for (let i = 0; i < 4; i++) { X.rotate(Math.PI / 2); X.beginPath(); X.moveTo(0, 0); X.lineTo(R, 0); X.stroke(); }
  }
  X.restore();
}
function casa(t) {
  if (t < L[10]) return;
  const [sx, sy] = tela(2520, 1064); const k = K.s;
  X.save(); X.translate(sx, sy); X.scale(k, k);
