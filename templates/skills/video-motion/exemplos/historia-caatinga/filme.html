function mandacaru(wx, wy, s) { const [x, y] = tela(wx, wy); const k = K.s * s; X.save(); X.translate(x, y); X.scale(k, k); X.fillStyle = '#6f9a3e'; X.strokeStyle = '#46682a'; X.lineWidth = 5; const rr = (a, b, w, hh) => { X.beginPath(); X.roundRect(a, b, w, hh, w / 2); X.fill(); X.stroke(); }; rr(-18, -230, 36, 230); rr(-70, -165, 28, 90); rr(-70, -95, 56, 24); rr(40, -190, 28, 110); rr(18, -100, 50, 24); X.strokeStyle = '#e8e0c8'; X.lineWidth = 2; for (let i = 0; i < 18; i++) { const yy = -220 + i * 12; X.beginPath(); X.moveTo(-18, yy); X.lineTo(-28, yy - 4); X.moveTo(18, yy); X.lineTo(28, yy - 4); X.stroke(); } X.restore(); }
